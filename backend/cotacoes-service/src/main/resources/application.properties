quarkus.http.port=8081

quarkus.swagger-ui.always-include=true

quarkus.datasource.db-kind=mysql

quarkus.datasource.username=${MYSQL_USER}
quarkus.datasource.password=${MYSQL_PASSWORD}

quarkus.hibernate-orm.database.generation=none

quarkus.flyway.migrate-at-start=true

%dev.quarkus.datasource.jdbc.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:quotare}?connectionTimeZone=UTC&allowPublicKeyRetrieval=true&useSSL=false
%prod.quarkus.datasource.jdbc.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?connectionTimeZone=UTC&sslMode=REQUIRED

%test.quarkus.datasource.username=quotare_test
%test.quarkus.datasource.password=quotare_test
%test.quarkus.datasource.devservices.image-name=mysql:8
%test.quarkus.datasource.devservices.properties.connectionTimeZone=UTC

cotacoes.serie.intervalo-maximo-dias=1825

quarkus.rest-client.integracao-service.url=${INTEGRACAO_SERVICE_URL:http://localhost:8082}
quarkus.rest-client.integracao-service.connect-timeout=${INTEGRACAO_SERVICE_CONNECT_TIMEOUT:3000}
quarkus.rest-client.integracao-service.read-timeout=${INTEGRACAO_SERVICE_READ_TIMEOUT:5000}

ingestao.janela-inicial=${INGESTAO_JANELA_INICIAL:P30D}
ingestao.cron=${INGESTAO_CRON:0 0/15 * * * ?}
%test.ingestao.cron=off
