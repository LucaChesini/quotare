quarkus.http.port=8081

quarkus.datasource.db-kind=mysql

quarkus.datasource.username=${MYSQL_USER}
quarkus.datasource.password=${MYSQL_PASSWORD}

quarkus.hibernate-orm.database.generation=none

quarkus.flyway.migrate-at-start=true

%dev.quarkus.datasource.jdbc.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:quotare}?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
%test.quarkus.datasource.jdbc.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:quotare}?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
%prod.quarkus.datasource.jdbc.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?serverTimezone=UTC&sslMode=VERIFY_IDENTITY
